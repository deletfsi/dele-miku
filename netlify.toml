[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/mangabill/xuanchuan"
  to = "/mangabill/index.html"
  status = 200

[[redirects]]
  from = "/mangabill/xuanchuan/"
  to = "/mangabill/index.html"
  status = 200

[[redirects]]
  from = "/mangabill/miku"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mangabill/miku/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mangabill/analytics"
  to = "/analytics.html"
  status = 200

[[redirects]]
  from = "/mangabill/analytics/"
  to = "/analytics.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mangabill/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mangabill/generated/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/mangabill/generated/lore/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/mangabill/generated/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

