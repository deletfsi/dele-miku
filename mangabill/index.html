(function(){const a=document.createElement("link").relList;if(a&&a.supports&&a.supports("modulepreload"))return;for(const l of document.querySelectorAll('link[rel="modulepreload"]'))s(l);new MutationObserver(l=>{for(const i of l)if(i.type==="childList")for(const o of i.addedNodes)o.tagName==="LINK"&&o.rel==="modulepreload"&&s(o)}).observe(document,{childList:!0,subtree:!0});function t(l){const i={};return l.integrity&&(i.integrity=l.integrity),l.referrerPolicy&&(i.referrerPolicy=l.referrerPolicy),l.crossOrigin==="use-credentials"?i.credentials="include":l.crossOrigin==="anonymous"?i.credentials="omit":i.credentials="same-origin",i}function s(l){if(l.ep)return;l.ep=!0;const i=t(l);fetch(l.href,i)}})();const ce=[{slug:"elaina",folder:"伊蕾娜",name:"伊蕾娜",latinName:"Elaina",title:"旅途中的银蓝票面",description:"银蓝冷光压低了纸面温度，魔女帽、星屑与旅行印章像从夜色里慢慢浮出来。",denomination:"100",motif:"旅行、星屑、冷光",accent:"#3F6F98",colorName:"银蓝冷光",colorMeaning:"从实拍里的紫蓝荧光和魔女主题提取，适合表现夜色、旅途和一点不可预测的魔法感。",palette:["#3F6F98","#6AB6D6","#1A1B2E","#F2E7B8"],coverIndex:0,highlights:["帽檐轮廓与星屑纹样构成第一眼识别","银蓝冷光让编号和暗纹像旅途印章","实拍里的黑蓝背景保留“旁观者”的安静距离"],paragraphs:["伊蕾娜这一版不追求热闹。它把**灰之魔女的帽檐、星屑、夜色冷光**收进票面，让纸币像一页被夹在旅行手账里的异国收据：边缘有风，编号有路程。","主色 **#3F6F98 银蓝冷光** 负责把轻盈和疏离感稳住。近看是防伪纹、面额和细线，远看则像魔法扫过纸面后留下的光，刚好对应伊蕾娜“看见世界，却不轻易替世界下结论”的气质。"]},{slug:"kaori",folder:"宫园薰",name:"宫园薰",latinName:"Kaori Miyazono",title:"把旋律印进纸币",description:"春日暖金落在琴弦、舞台灯和乐谱边框上，像一段还没结束的小提琴独奏。",denomination:"50",motif:"旋律、春光、舞台",accent:"#D49A2F",colorName:"小提琴金",colorMeaning:"取自舞台灯、琴弦和春日暖光，给纸币带来轻快但不喧闹的明亮感。",palette:["#D49A2F","#F3D67A","#E87979","#FFF5DF"],coverIndex:0,highlights:["暖金色像演奏厅里落下的灯","琴弦线条能自然变成票面边框","留白让青春和告别都不被说得太满"],paragraphs:["宫园薰这一版要有音乐响起前的空气。**小提琴、樱花、舞台灯、乐谱边线**被压进纸纹里，票面不只是角色图，也像一张从春天音乐会带回来的纪念券。","暖金与浅粉让画面保持明亮，但边框和编号仍然克制。MangaBill 在这里更像一小段乐章：前半段明亮，后半段留白，把薰那种自由又带着脆弱的光留住。"]},{slug:"bocchi",folder:"波奇酱",name:"波奇酱",latinName:"Bocchi",title:"下北泽的粉色票据",description:"下北泽粉色、Live House 灯牌和吉他噪点叠在一起，把社恐少女的勇气做成票据。",denomination:"50",motif:"乐队、街区、粉色",accent:"#D95B73",colorName:"下北泽粉",colorMeaning:"来自角色视觉中的粉色，也呼应乐队海报和独立唱片的青春感。",palette:["#D95B73","#F3A6B4","#5B546D","#F8ECEF"],coverIndex:0,highlights:["粉色主光直接连接波奇的发色和运动服","吉他拨片与海报感适合做成票面符号","强反差实拍让舞台紧张感更鲜活"],paragraphs:["波奇酱这一版可以稍微更有噪点。**粉色运动服、吉他、Live House、下北泽海报**让票面像一张小型演出票根，带一点局促，也带一点终于站上舞台的亮。","粉色不是甜腻装饰，而是角色的外壳和信号灯。实拍里的反光、封套边缘和编号能把这种“想躲起来但又想被听见”的矛盾感托出来。"]},{slug:"roxy",folder:"洛琪希",name:"洛琪希",latinName:"Roxy",title:"魔法学院的蓝色徽记",description:"蓝发、法袍和法杖像学院徽记一样落在深蓝票面上，安静但有老师的分量。",denomination:"100",motif:"魔法、学院、蓝调",accent:"#315F9F",colorName:"学院深蓝",colorMeaning:"取自魔法学院、法袍和夜间书房的冷静色调，适合承载徽章和细密花纹。",palette:["#315F9F","#7CA6D8","#2B2540","#EADDBD"],coverIndex:0,galleryFirstOriginalName:"微信图片_20260523165822_1310_51.jpg",highlights:["法袍深蓝适合做成学院式主色","法杖和徽章纹能成为票面中心符号","旅人身份让纸币带一点异世界地图感"],paragraphs:["洛琪希这一版的重点是“启蒙”。**蓝发、法袍、法杖、魔术教师**不是堆设定，而是让票面拥有一枚学院徽章般的秩序感。","深蓝让角色显得沉稳，浅金边框则保留纪念钞的郑重。MangaBill 看起来像从异世界课堂、旅店和冒险地图之间寄回来的纸面凭证。"]},{slug:"rin",folder:"志摩凛",name:"志摩凛",latinName:"Rin Shima",title:"富士山前的清冷纪念票",description:"湖畔青蓝、围巾、摩托和富士山冷空气，让票面像从营地带回的旅行券。",denomination:"10000",motif:"露营、湖光、富士山",accent:"#4B8AA2",colorName:"湖畔青蓝",colorMeaning:"来自实拍里的湖面、天空和富士山冷色层次，清爽但不轻飘。",palette:["#4B8AA2","#A7D4E4","#E9D7B7","#2E4B3E"],coverIndex:0,highlights:["湖畔青蓝把冬日空气带进页面","围巾与露营器具适合做细节入口","10000 面额强化旅行纪念票的分量"],paragraphs:["志摩凛这一版要安静。**围巾、摩托、营地灯、湖面和富士山**让 MangaBill 像一张从露营地收好的旅行票，不催促，只把冷空气和热饮的温度留下。","青蓝主色让画面清澈，纸纹和面额则像路线图上的标记。近看时，票面里的边框和编号会变成“这一次出发”的小证据。"],galleryFirstOriginalName:"1779350028538.png"},{slug:"frieren",folder:"芙丽莲",name:"芙丽莲",latinName:"Frieren",title:"长旅之后的蓝白钞面",description:"蓝白纸纹像漫长旅途里的旧书页，法杖、精灵耳和回忆一起沉到票面深处。",denomination:"20",motif:"长旅、记忆、古典纹样",accent:"#5274B8",colorName:"苍蓝记忆",colorMeaning:"来自长旅、魔法与淡蓝票纹，带有时间被慢慢沉淀下来的感觉。",palette:["#5274B8","#B8CBEF","#8F6A3D","#F2EADB"],coverIndex:0,highlights:["蓝白主色保留长旅之后的清冷感","法杖与古典花纹像旧魔法书页","实拍留白让时间感比热闹动效更重要"],paragraphs:["芙丽莲这一版应该慢一点。**精灵耳、双马尾、法杖、旧队伍的回忆**被放进蓝白纸纹里，像一页从很长很长的旅途中取出的账本。","主色不需要大声，蓝白和浅金负责讲时间。MangaBill 的编号、暗纹和边框像旧书页上的压痕，让“魔王倒下之后”的旅程仍然有重量。"],galleryFirstOriginalName:"芙丽莲公园照片.jpg"},{slug:"furina",folder:"芙宁娜",name:"芙宁娜",latinName:"Furina",title:"剧场感与水色票纹",description:"枫丹纯蓝像歌剧院主光，礼帽、审判席和水纹把登场感撑成一张纪念票。",denomination:"500",motif:"剧场、水纹、仪式",accent:"#1688E8",colorName:"枫丹纯蓝",colorMeaning:"参考芙宁娜的水色舞台、蓝白礼服和枫丹审判庭的清亮光感，让详情页一进入就像切到歌剧院的蓝色聚光里。",palette:["#1688E8","#63C7FF","#0F3A75","#F4FAFF"],coverIndex:0,highlights:["纯蓝色直接形成芙宁娜的舞台主光","白银边线让礼服与水纹更有仪式感","票面需要像剧场门票，也像被编号的收藏钞"],paragraphs:["芙宁娜这一版要像开幕。**礼帽、蓝白礼服、水元素、审判席与欧庇克莱歌剧院**都被收束成一束纯蓝主光，华丽，但线条要清楚。","专属色 **#1688E8 枫丹纯蓝** 是整页的舞台灯。日间模式下清透，黑暗模式下像剧场里的反光；MangaBill 的水纹和银白边框则负责把“登场”的仪式感稳住。"]},{slug:"fern",folder:"菲伦",name:"菲伦",latinName:"Fern",title:"柔光里的魔法票据",description:"暮紫柔光、法杖和行旅日常贴近菲伦本人，纸面更安静，也更细致。",denomination:"20",motif:"魔法、柔光、纸纹",accent:"#6D5F8F",colorName:"暮紫魔法",colorMeaning:"以紫色魔法感为基础，降低饱和度，让整体更沉稳、安静。",palette:["#6D5F8F","#B7A9D6","#4B3F5B","#EFE8D6"],coverIndex:0,galleryFirstOriginalName:"微信图片_20260523165907_1350_51.jpg",highlights:["暮紫主色把菲伦从芙丽莲的蓝白里区分出来","法杖与披肩细节强调年轻魔法使的克制","票面更像夹在旅途笔记里的日常收据"],paragraphs:["菲伦这一版要把视线放低，放到日常里。**暮紫披肩、法杖、行李、照顾旅伴的细节**让票面不像英雄长卷，而像旅途中被细心夹好的一张纸。","她和芙丽莲同在一部作品里，但色调不能相同。菲伦用暮紫、柔光和细密纸纹讲成长：不抢眼，却把每一步修行、每一次赶路都记得很清楚。"]},{slug:"columbina",folder:"哥伦比娅",name:"哥伦比娅",latinName:"Columbina",title:"深色戏剧票面的低语",description:"暗红幕布、银色边框和近乎静止的神情，让有限的官方信息变成低声的舞台感。",denomination:"100",motif:"舞台、暗调、金属感",accent:"#8B3F51",colorName:"深玫瑰暗红",colorMeaning:"以暗红和低饱和玫瑰色表现舞台幕布、神秘感和冷艳气质。",palette:["#8B3F51","#C7858F","#21161C","#D7C4A6"],coverIndex:0,highlights:["暗红主色保留愚人众的危险气息","银白细线像舞台上掠过的冷光","素材越克制，票面越要讲究留白和悬念"],paragraphs:["哥伦比娅这一版不需要把未知填满。**幕布、闭合的眼、执行官的席位、暗红与银白**足够构成她的舞台：安静，漂亮，也有一点危险。","MangaBill 在这里更像一张只露出半边的剧场通行证。官方信息有限，反而让暗纹、编号和边框有了更多余地，适合把神秘感做得更克制。"]},{slug:"violet",folder:"薇尔莉特",name:"薇尔莉特",latinName:"Violet",title:"信笺与机械手的纪念纸币",description:"紫罗兰墨色、制服、机械手和信笺纸纹，把沉默的情感折成一张纪念票。",denomination:"100",motif:"信笺、制服、机械手",accent:"#6A5B9F",colorName:"紫罗兰墨色",colorMeaning:"从角色名、制服和信笺主题提取，兼具优雅、克制和一点金属冷光。",palette:["#6A5B9F","#AFA3D8","#1E2433","#E8D8B0"],coverIndex:0,highlights:["紫罗兰墨色连接名字与书信主题","机械手冷光适合做票面高光","信封和打字机元素让纸币有信笺质感"],paragraphs:["薇尔莉特这一版像一封没有立刻拆开的信。**制服、胸针、机械手、打字机和信笺**让票面自带纸张的温度，也保留她克制的优雅。","紫罗兰墨色配浅金边框，能把“代写书信”的主题转成收藏钞语言。近看是纹理和编号，远看则像一段终于被写下来的心意。"]}],pe=JSON.parse(`[{"slug":"elaina","workTitle":"魔女之旅","workSubtitle":"The Journey of Elaina","sourceType":"动画","officialSite":"https://majotabi.jp/","tagline":"她把世界一页页翻过去，只在纸面上留下风、星光和一点不动声色的判断。","overview":["《魔女之旅》像一本由短篇组成的游记。伊蕾娜抵达不同国家，也遇见温柔、荒诞、残酷和难以评判的选择；故事很少急着给答案，更像让观众和旅人一起站在路口。","MangaBill 这一版把“旅人”放在最前面：银蓝冷光像夜色里的魔法，浅金边框像通关印章，纸纹则像被翻过很多次的手账页。"],"characterFocus":["伊蕾娜从憧憬旅行魔女尼可开始，后来成为年轻的“灰之魔女”。她聪明、自信，有时也会保持距离；这种不急着介入一切的旁观感，是她最特别的地方。","所以票面不需要把她做得过分热血。帽檐、灰发、星屑和冷色魔法光已经足够说明：这是一个把世界写进旅途的人。"],"relatedCharacters":[{"name":"芙兰","tag":"师父","role":"伊蕾娜的师父，给她的旅程留下重要起点。","avatarUrl":"https://majotabi.jp/assets/character/t3.png","avatarPageUrl":"https://majotabi.jp/","avatarSourceName":"Official character image"},{"name":"沙耶","tag":"旅途中的魔女","role":"旅途中反复出现的魔女，与伊蕾娜形成明亮的互动。","avatarUrl":"https://majotabi.jp/assets/character/t2.png?0701","avatarPageUrl":"https://majotabi.jp/","avatarSourceName":"Official character image"},{"name":"尼可","tag":"憧憬的旅行者","role":"伊蕾娜憧憬的旅行魔女，也是“旅行”意象的重要来源。","avatarUrl":"https://majotabi.jp/assets/character/t4.png","avatarPageUrl":"https://majotabi.jp/","avatarSourceName":"Official character image"}],"storyBeats":["一座城、一片花田、一段夜路，都像手账里的独立页码；翻过去之后，余味还在。","银蓝光适合承接她的冷静，浅金细线则像每一次旅行留下的印章。","看这版 MangaBill 时，不妨从帽檐和冷光开始，再落到编号；它像一张从异国带回来的小凭证。"],"production":[{"label":"原作","value":"白石定规"},{"label":"动画制作","value":"C2C"},{"label":"监督","value":"洼冈俊之"},{"label":"系列构成","value":"笔安一幸"},{"label":"伊蕾娜声优","value":"本渡枫"}],"officialSources":[{"label":"动画官网","url":"https://majotabi.jp/"}],"assetKeywords":["伊蕾娜","Elaina","chara","visual","vis","main"],"maxOfficialImages":10,"visualNotes":[{"label":"帽檐","title":"灰之魔女的第一道轮廓","text":"宽帽檐让伊蕾娜一眼就从画面里站出来。票面可以把帽檐弧线转成边框的起势，让人物还没出现，旅行魔女的影子已经先到。"},{"label":"星屑","title":"冷色魔法不必太亮","text":"伊蕾娜的魔法感更像夜里扫过纸面的光。星屑和细线适合做成暗纹，让 MangaBill 近看才发现细节。"},{"label":"旅程","title":"她经过世界，而不是占有世界","text":"她常常见证复杂的国家和选择，却不把自己放成唯一答案。票面留白越克制，越能留下这份旅人的距离。"},{"label":"票纹","title":"像一枚被收好的旅行印章","text":"银蓝主色、浅金边框和编号可以组合成“通行证”的感觉，让实拍图像从某个陌生城市的柜台上拿回来的纪念券。"}],"artifactNotes":[{"label":"冷光","title":"银蓝是这版的温度","text":"**#3F6F98** 把夜色和魔法压低，防伪纹因此更像旅途中短暂亮起的咒文。"},{"label":"印章","title":"面额像路上的章","text":"编号和面额不只是装饰，它们像被盖在手账上的印记，提示这是一段被收藏的旅程。"},{"label":"留白","title":"旁观者的距离","text":"画面不要塞满，留一点空白给风和判断；这比把设定写满更接近伊蕾娜。"}],"objectNotes":[{"label":"魔女帽","title":"先被风认出来的轮廓","text":"伊蕾娜的帽檐像一条很安静的边界：她看见别人，也保留自己。票面可以把帽檐做成细金线，让她的**旅人距离感**一眼就成立。","sourceLabel":"动画官网 Story / Introduction","sourceUrl":"https://majotabi.jp/"},{"label":"法杖","title":"不是武器，更像一支笔","text":"法杖让她可以越过山与城，也像把每一段见闻轻轻点在纸上。MangaBill 里适合用冷银色光点做暗纹，近看才发现那是魔法留下的轨迹。","sourceLabel":"动画官网","sourceUrl":"https://majotabi.jp/"},{"label":"旅行手账","title":"她经过世界，不把世界占为己有","text":"《魔女之旅》的动人处，不是每个国家都给答案，而是伊蕾娜把它们翻过去又记下来。票面留白因此很重要，像手账里还没写完的一页。","sourceLabel":"动画官网 Story","sourceUrl":"https://majotabi.jp/"}],"memoryLine":{"mode":"情绪意译","line":"我只是旅人，所以把故事轻轻带走。","note":"这句话不是为了显得冷淡，而是为了保护她的温柔。她见过太多人的愿望和代价，所以 MangaBill 这一版应该像一张被夹在书里的旅券，漂亮，但不喧哗。","sourceLabel":"动画官网 Story","sourceUrl":"https://majotabi.jp/"},"minOfficialLongEdge":850,"manualAssets":[{"url":"https://majotabi.jp/images/top-main/1/chara-a.png","pageUrl":"https://majotabi.jp/","sourceName":"??????","caption":"Elaina character visual"},{"url":"https://majotabi.jp/images/top-main/3/chara-a.png","pageUrl":"https://majotabi.jp/","sourceName":"??????","caption":"Elaina witch visual"},{"url":"https://majotabi.jp/assets/story/1_3.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina close-up"},{"url":"https://majotabi.jp/assets/story/1_5.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina magic scene"},{"url":"https://majotabi.jp/assets/story/2_1.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina arriving at a city"},{"url":"https://majotabi.jp/assets/story/2_3.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina at the window"},{"url":"https://majotabi.jp/assets/story/4_2.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina quiet close-up"},{"url":"https://majotabi.jp/assets/story/5_1.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina reading"},{"url":"https://majotabi.jp/assets/story/6_3.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina battle magic"},{"url":"https://majotabi.jp/assets/story/10_8.jpg","pageUrl":"https://majotabi.jp/story.html","sourceName":"??????","caption":"Elaina flying"}],"manualOnly":true},{"slug":"kaori","workTitle":"四月是你的谎言","workSubtitle":"Your Lie in April","sourceType":"动画","officialSite":"https://www.kimiuso.jp/","tagline":"她把春天拉成一段琴声，也把沉默的青春重新照亮。","overview":["《四月是你的谎言》写音乐，也写人被音乐重新打开的瞬间。演奏厅、练习室、樱花和少年少女的关系交错在一起，胜负反而退到后面。","宫园薰的 MangaBill 应该像一张音乐会票根：暖金是舞台灯，浅粉是春天，细线边框则像乐谱上轻轻拉开的五线。"],"characterFocus":["宫园薰用小提琴闯进有马公生的世界。她的演奏自由、任性、明亮，像是不愿被谱面完全框住的风。","她身上最动人的不是“完美”，而是把生命力几乎全部放进音乐里。票面可以因此更轻、更亮，也更有未说完的余韵。"],"relatedCharacters":[{"name":"有马公生","role":"钢琴少年，宫园薰的演奏重新影响了他的音乐世界。","avatarUrl":"https://www.kimiuso.jp/assets/img/chara/chara1_1.png","avatarPageUrl":"https://www.kimiuso.jp/character/","avatarExtract":{"left":72,"top":88,"width":250,"height":250},"avatarSourceName":"Official character image","avatarTrim":false,"avatarPosition":"center"},{"name":"泽部椿","role":"公生的青梅竹马，承载日常与青春关系线。","avatarUrl":"https://www.kimiuso.jp/assets/img/chara/chara3_1.png","avatarPageUrl":"https://www.kimiuso.jp/character/","avatarExtract":{"left":72,"top":88,"width":250,"height":250},"avatarSourceName":"Official character image","avatarTrim":false,"avatarPosition":"center"},{"name":"渡亮太","role":"朋友组的一员，让故事保持校园生活的轻快部分。","avatarUrl":"https://www.kimiuso.jp/assets/img/chara/chara4_1.png","avatarPageUrl":"https://www.kimiuso.jp/character/","avatarExtract":{"left":72,"top":88,"width":250,"height":250},"avatarSourceName":"Official character image","avatarTrim":false,"avatarPosition":"center"}],"storyBeats":["樱花、琴盒、舞台灯和演奏前的安静，是薰这一页最该留下的空气。","暖金色负责照亮，乐谱线条负责秩序，留白则让青春的疼痛不被说破。","MangaBill 可以像一小段 encore：曲子停了，纸面还留着余音。"],"production":[{"label":"原作","value":"新川直司"},{"label":"动画制作","value":"A-1 Pictures"},{"label":"监督","value":"石黑恭平"},{"label":"系列构成","value":"吉冈孝夫"},{"label":"音乐","value":"横山克"},{"label":"宫园薰声优","value":"种田梨沙"}],"officialSources":[{"label":"动画官网","url":"https://www.kimiuso.jp/"},{"label":"角色页","url":"https://www.kimiuso.jp/character/"},{"label":"故事页","url":"https://www.kimiuso.jp/story/"}],"assetKeywords":["kaori","kawori","miyazono","character","story","kv","main"],"maxOfficialImages":6,"visualNotes":[{"label":"小提琴","title":"琴弦把票面拉成乐谱","text":"琴弦的直线和弓的斜线很适合转成防伪纹，让纸币边框像一段正要开始的旋律。"},{"label":"春光","title":"暖金不是华丽，是回声","text":"薰的明亮感适合用暖金承接。它不需要喧哗，只要像舞台灯落在琴身上那样柔和。"},{"label":"舞台","title":"演奏厅里的短暂勇气","text":"她改变公生的方式不是说教，而是演奏。票面可以保留开场前的空白，让粉丝自己想起那束灯。"},{"label":"票根","title":"把一场春天收进编号里","text":"编号、面额和细边框像音乐会票根；MangaBill 因此不是海报，而是一件能被夹进书页里的纪念物。"}],"artifactNotes":[{"label":"灯","title":"舞台暖金","text":"暖金主光让角色的自由感有落点，像小提琴独奏刚刚擦亮空气。"},{"label":"线","title":"乐谱边框","text":"票面细线可以像五线谱延伸，把纸币结构和音乐主题自然接上。"},{"label":"白","title":"未说完的留白","text":"留白越干净，薰的轻盈和伤感越容易被看见。"}],"objectNotes":[{"label":"小提琴","title":"她把春天拉得很用力","text":"宫园薰的琴声不只是好听，而是把公生从灰色里拉回舞台。票面上的金色可以像琴弓划过空气，把她那种**明亮又倔强**的生命力留下来。","sourceLabel":"动画官网 Story #02","sourceUrl":"https://www.kimiuso.jp/story/02.html"},{"label":"钢琴","title":"公生重新听见自己的地方","text":"官网剧情里，公生在旧钢琴前被她推回音乐里；钢琴键适合变成 MangaBill 的底纹，黑白之间夹一点樱色，像重新开始呼吸。","sourceLabel":"动画官网 Story #03","sourceUrl":"https://www.kimiuso.jp/story/03.html"},{"label":"乐谱","title":"不是照着走，而是活着演奏","text":"她的演奏总像在和乐谱争辩：不是叛逆给别人看，而是想把此刻活成唯一一次。票面可以把音符做成断续的微光，让粉丝想到那场无法重来的合奏。","sourceLabel":"动画官网 Story #04","sourceUrl":"https://www.kimiuso.jp/story/04.html"}],"memoryLine":{"mode":"官方网站标语","line":"Once we meet somebody, we can no longer be alone.","note":"这句官网首页标语很适合放在 MangaBill 里：它不是直接煽情，而是轻轻提醒人，某个春天、某段旋律、某个人，真的会改变我们看世界的颜色。","sourceLabel":"英文官方网站","sourceUrl":"https://www.yourlieinapril.com/"},"minOfficialLongEdge":700,"manualAssets":[{"url":"https://www.kimiuso.jp/assets/img/chara/chara2_1.png","pageUrl":"https://www.kimiuso.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://www.kimiuso.jp/assets/img/story/episode/photo/01/photo3.jpg","pageUrl":"https://www.kimiuso.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://www.kimiuso.jp/assets/img/story/episode/photo/02/photo4.jpg","pageUrl":"https://www.kimiuso.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://www.kimiuso.jp/assets/img/story/episode/photo/03/photo3.jpg","pageUrl":"https://www.kimiuso.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://www.kimiuso.jp/assets/img/story/episode/photo/04/photo2.jpg","pageUrl":"https://www.kimiuso.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://www.kimiuso.jp/assets/img/story/episode/photo/16/photo5.jpg","pageUrl":"https://www.kimiuso.jp/story/","sourceName":"Official visual","caption":"curated official visual"}],"manualOnly":true},{"slug":"bocchi","workTitle":"孤独摇滚！","workSubtitle":"Bocchi the Rock!","sourceType":"动画","officialSite":"https://bocchi.rocks/","tagline":"粉色噪点从角落里亮起来，像一首终于被弹出来的歌。","overview":["《孤独摇滚！》把社恐、乐队和下北泽的街区气味混在一起。它很好笑，但不是只靠夸张表情；真正好看的地方，是后藤一里一点点学会和舞台共处。","波奇酱的 MangaBill 可以带一点海报纸质感：粉色主光、吉他噪点、Live House 灯牌和封套反光，让票面像一件从乐队周边柜台拿到的收藏品。"],"characterFocus":["后藤一里不擅长社交，却把大量时间交给吉他。她的矛盾很鲜明：想躲进箱子，也想让别人听见自己的声音。","票面要抓住这种反差。粉色并不只是可爱，它也像警报灯、舞台灯和一张鼓起勇气递出去的演出票。"],"relatedCharacters":[{"name":"伊地知虹夏","role":"结束乐队鼓手，也是把波奇带进乐队日常的重要人物。","avatarUrl":"https://bocchi.rocks/tv/assets/img/page/character/nijika/main.png","avatarPageUrl":"https://bocchi.rocks/tv/character/nijika.html","avatarTrim":true,"avatarSourceName":"Official character image"},{"name":"山田凉","role":"贝斯手，冷淡又有独特幽默感。","avatarUrl":"https://bocchi.rocks/tv/assets/img/page/character/ryo/main.png","avatarPageUrl":"https://bocchi.rocks/tv/character/ryo.html","avatarTrim":true,"avatarSourceName":"Official character image"},{"name":"喜多郁代","role":"主唱兼吉他，明亮性格和波奇形成强烈对照。","avatarUrl":"https://bocchi.rocks/tv/assets/img/page/character/ikuyo/main.png","avatarPageUrl":"https://bocchi.rocks/tv/character/ikuyo.html","avatarTrim":true,"avatarSourceName":"Official character image"}],"storyBeats":["排练室、Live House、下北泽街头和乐队海报，是波奇世界里的日常风景。","粉色噪点可以让 MangaBill 更像独立音乐周边，而不是普通角色卡。","看到实拍里的反光和封套边缘时，会有一种“这张票刚从现场带回来”的感觉。"],"production":[{"label":"原作","value":"滨路晶"},{"label":"动画制作","value":"CloverWorks"},{"label":"监督","value":"斋藤圭一郎"},{"label":"系列构成","value":"吉田惠里香"},{"label":"音乐","value":"菊谷知树"},{"label":"后藤一里声优","value":"青山吉能"}],"officialSources":[{"label":"剧场总集篇官网","url":"https://bocchi.rocks/"},{"label":"TV 动画官网","url":"https://bocchi.rocks/tv/"},{"label":"角色页","url":"https://bocchi.rocks/tv/character/"},{"label":"故事页","url":"https://bocchi.rocks/tv/story/"}],"assetKeywords":["bocchi","hitori","goto","kessoku","mainvisual","character","compilation"],"maxOfficialImages":8,"visualNotes":[{"label":"粉色","title":"害羞也可以很醒目","text":"粉色连接波奇的发色和运动服，也连接她被迫站到灯下的紧张感。票面用粉色，不是卖萌，而是让角色的局促变得可见。"},{"label":"吉他","title":"她真正能说话的地方","text":"吉他是波奇的出口。拨片、琴弦和音箱噪点都能变成票面纹样，让纸币带一点 Live House 的声响。"},{"label":"箱子","title":"想藏起来的那一面","text":"波奇的幽默来自她的躲闪。页面互动可以让细节一层层展开，就像她慢慢从角落里探出来。"},{"label":"票根","title":"下北泽的一张小演出票","text":"编号和面额可以像演出入场券，搭配粉色海报感，让 MangaBill 更接近乐队周边。"}],"artifactNotes":[{"label":"噪点","title":"纸面要有一点现场感","text":"粉色颗粒、强反差灯光和封套反光，会让票面像刚从 Live House 柜台拿起。"},{"label":"节拍","title":"边框像一小段 riff","text":"重复线条可以模拟节拍，让静态纸币仍有乐队的速度。"},{"label":"勇气","title":"亮起来，但不要太顺利","text":"波奇的可爱在于不完美。票面保留一点紧张和空白，比全程闪耀更贴近她。"}],"objectNotes":[{"label":"吉他","title":"她先在角落里练到发光","text":"官网角色页写到后藤一里是结束乐队的 Lead Guitar。吉他在这里不是炫技道具，而是她试着和世界说话的方式；票面可以把琴弦做成细线防伪纹。","sourceLabel":"动画官网 角色页","sourceUrl":"https://bocchi.rocks/tv/character/hitori.html"},{"label":"拨片与线缆","title":"小小的东西，也能接上勇气","text":"拨片、效果器线、排练室地面这些细节，比宏大的舞台更像波奇酱。MangaBill 可以把这些碎片做成边角图案，让害羞也拥有自己的质感。","sourceLabel":"动画官网","sourceUrl":"https://bocchi.rocks/tv/"},{"label":"Live House","title":"她不是突然勇敢，是被朋友接住","text":"结束乐队的舞台感来自四个人互相兜底。票面别只做粉色可爱，也要留一点地下 Live House 的黑、灯、音箱和汗，才像真正的波奇酱。","sourceLabel":"动画官网 角色页","sourceUrl":"https://bocchi.rocks/tv/character/hitori.html"}],"memoryLine":{"mode":"情绪意译","line":"害怕也没关系，先把这一小节弹完。","note":"后藤一里的共鸣点不是“社恐梗”，而是很多人都懂的那种笨拙努力。MangaBill 这一版要让粉丝想到：胆小的人也可以用很小的声音，慢慢把自己点亮。","sourceLabel":"动画官网 角色页","sourceUrl":"https://bocchi.rocks/tv/character/hitori.html"},"minOfficialLongEdge":700,"manualAssets":[{"url":"https://bocchi.rocks/tv/assets/img/page/character/hitori/main.png","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://bocchi.rocks/tv/SYS/CONTENTS/story_2372_photo_1664448906127941412","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://bocchi.rocks/tv/SYS/CONTENTS/story_2376_photo_1665457732885767504","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://bocchi.rocks/tv/SYS/CONTENTS/story_2406_photo_1666676729280211323","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://bocchi.rocks/tv/SYS/CONTENTS/story_2413_photo_1667287423005740818","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://bocchi.rocks/tv/SYS/CONTENTS/story_2413_photo_1667287426322373556","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://bocchi.rocks/tv/SYS/CONTENTS/story_2433_photo_1667892341133331552","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://bocchi.rocks/tv/SYS/CONTENTS/story_2446_photo_16697044012351988","pageUrl":"https://bocchi.rocks/tv/story/","sourceName":"Official visual","caption":"curated official visual"}],"manualOnly":true},{"slug":"roxy","workTitle":"无职转生 ～到了异世界就拿出真本事～","workSubtitle":"Mushoku Tensei","sourceType":"动画","officialSite":"https://mushokutensei.jp/","tagline":"她像异世界最早亮起的蓝光，把门外的地图展开给少年看。","overview":["《无职转生》从人生重启讲到旅行、家庭、学院和自我修正，世界观很厚。洛琪希出现得很早，却把主角从封闭空间带向更大的世界。","这版 MangaBill 可以做得像魔法学院的票据：深蓝法袍、法杖、徽章纹和浅金边框，既有老师的稳，也有旅人的远。"],"characterFocus":["洛琪希是米格路德族魔术师，也是鲁迪乌斯最初的魔术老师。她的认真、耐心和旅行者身份，让她不只是“师父”标签。","票面可以突出蓝发、法袍和法杖，让她的沉稳从色彩里先出来，再用徽记和纸纹补上异世界学院感。"],"relatedCharacters":[{"name":"鲁迪乌斯","role":"故事主角，洛琪希是他魔术学习和精神转变的重要起点。","avatarUrl":"https://mushokutensei.jp/wp-content/themes/mushoku_re/img/character/img_character01.png","avatarPageUrl":"https://mushokutensei.jp/character/","avatarTrim":true,"avatarSourceName":"Official character image"},{"name":"希露菲叶特","role":"鲁迪乌斯早期重要同伴，连接校园与成长线。","avatarUrl":"https://mushokutensei.jp/wp-content/themes/mushoku_re/img/character/img_character03.png","avatarPageUrl":"https://mushokutensei.jp/character/","avatarTrim":true,"avatarSourceName":"Official character image"},{"name":"艾莉丝","role":"旅行和战斗成长线中的核心角色。","avatarUrl":"https://mushokutensei.jp/wp-content/themes/mushoku_re/img/character/img_character04.png","avatarPageUrl":"https://mushokutensei.jp/character/","avatarTrim":true,"avatarSourceName":"Official character image"}],"storyBeats":["魔术教学、出门旅行、学院与地图，是洛琪希这一页最有分量的元素。","深蓝像法袍，浅金像徽章；两者放在一起，会让 MangaBill 有一种被授予的仪式感。","她带来的不是喧闹的胜利，而是走出房间的第一束光。"],"production":[{"label":"原作","value":"理不尽な孫の手"},{"label":"动画制作","value":"Studio Bind"},{"label":"音乐","value":"藤泽庆昌"},{"label":"角色原案","value":"白鹰"},{"label":"洛琪希声优","value":"小原好美"}],"officialSources":[{"label":"动画官网","url":"https://mushokutensei.jp/"},{"label":"角色页","url":"https://mushokutensei.jp/character/"},{"label":"故事页","url":"https://mushokutensei.jp/story/"}],"assetKeywords":["roxy","character","hero","visual","story","mushoku"],"manualOnly":true,"minOfficialLongEdge":300,"maxOfficialImages":5,"manualAssets":[{"url":"https://mushokutensei.jp/wp-content/themes/mushoku_re/img/character/img_character02.png","pageUrl":"https://mushokutensei.jp/character/","sourceName":"??????","caption":"??????"},{"url":"https://mushokutensei.jp/wp-content/uploads/2021/01/img_story02.jpg","pageUrl":"https://mushokutensei.jp/story/","sourceName":"??????","caption":"???????????"},{"url":"https://mushokutensei.jp/wp-content/uploads/2021/10/1.jpg","pageUrl":"https://mushokutensei.jp/story/","sourceName":"??????","caption":"???????????"},{"url":"https://mushokutensei.jp/wp-content/uploads/2024/06/1_MT2_21_0040.jpg","pageUrl":"https://mushokutensei.jp/story/","sourceName":"??????","caption":"?????????????"},{"url":"https://mushokutensei.jp/wp-content/uploads/2024/06/1_MT2_24_0128.jpg","pageUrl":"https://mushokutensei.jp/story/","sourceName":"??????","caption":"??????????"}],"visualNotes":[{"label":"蓝发","title":"清冷但可靠的主色","text":"洛琪希的蓝发和法袍让深蓝成为天然主色。票面用蓝，不是单纯幻想，而是老师气质的秩序。"},{"label":"法杖","title":"把魔术压成徽记","text":"法杖适合成为票面中心符号，像学院章一样稳定画面，也提醒粉丝她是启蒙者。"},{"label":"旅人","title":"她不只属于教室","text":"洛琪希常常在路上。地图感、旅店光和边框纹样能把她的旅行气质从“师父”身份里释放出来。"},{"label":"徽章","title":"像一张魔法学院凭证","text":"面额、编号和浅金边框可以处理成学院通行证，让 MangaBill 更有世界观里的正式感。"}],"artifactNotes":[{"label":"深蓝","title":"法袍压住画面","text":"深蓝主色让纸面安静下来，像一位老师站在门口等你迈出去。"},{"label":"徽记","title":"边框要有学院感","text":"浅金细线和对称纹样能把票面做成魔术证书，而不是普通角色海报。"},{"label":"地图","title":"旅途藏在纸纹里","text":"暗纹可以像地图等高线，提醒洛琪希身上也有旅行者的一面。"}],"objectNotes":[{"label":"法杖","title":"门外世界的第一束光","text":"洛琪希是鲁迪学习魔法时最重要的老师之一。法杖在票面里不必做得夸张，越像一件被长期握在手里的旧物，越能留下**师徒之间的温度**。","sourceLabel":"动画官网 Character","sourceUrl":"https://mushokutensei.jp/character/"},{"label":"魔术教材","title":"她教的不是天赋，是认真活下去","text":"《无职转生》的情感很大一部分来自“重新开始”。书页、注释和魔法阵可以变成票面暗纹，让洛琪希像一位把门打开的人。","sourceLabel":"动画官网 Character","sourceUrl":"https://mushokutensei.jp/character/"},{"label":"异世界饭桌","title":"旅途很远，热汤会把人留住","text":"异世界不是只有战斗和转移，也有赶路后的面包、汤和临时住处。票面加一点暖色食物意象，会让洛琪希这一版从冷蓝里透出生活气。","sourceLabel":"动画官网","sourceUrl":"https://mushokutensei.jp/"}],"memoryLine":{"mode":"情绪意译","line":"真正的老师，是把你送到更远的地方。","note":"洛琪希的动人处不是完美，而是她用耐心给别人一个重新面对世界的入口。MangaBill 可以把这种感谢藏在纸纹里：不大声，却一直在。","sourceLabel":"动画官网 Character","sourceUrl":"https://mushokutensei.jp/character/"}},{"slug":"rin","workTitle":"摇曳露营","workSubtitle":"Yuru Camp","sourceType":"动画","officialSite":"https://yurucamp.jp/","tagline":"冷空气、湖面和营地灯，把一个人的旅途照得很安静。","overview":["《摇曳露营》迷人的地方，不在激烈冲突，而在路线、风景、热饮和营地灯一点点堆出的生活感。它让“出去看看”本身变成故事。","志摩凛的 MangaBill 像一张露营地纪念券。湖畔青蓝、围巾、摩托、富士山和 10000 面额放在一起，会自然出现旅行收藏的分量。"],"characterFocus":["志摩凛喜欢一人露营，冷静、细心，也享受路上的独处。她不是很外放的人，却能让粉丝记住冬日营地的空气。","票面不必过度戏剧化。路线图式的分区、青蓝色冷光和纸面编号，就能把她的节奏慢慢说清楚。"],"relatedCharacters":[{"name":"各务原抚子","role":"开朗的露营伙伴，和凛形成一静一动的关系。","avatarUrl":"https://yurucamp.jp/third/assets/img/character/character1face1.png","avatarPageUrl":"https://yurucamp.jp/third/character/","avatarSourceName":"Official character image"},{"name":"大垣千明","role":"野外活动社成员，推动集体露营的热闹部分。","avatarUrl":"https://yurucamp.jp/third/assets/img/character/character4face1.png","avatarPageUrl":"https://yurucamp.jp/third/character/","avatarSourceName":"Official character image"},{"name":"犬山葵","role":"社团成员，日常交流里带来温和幽默。","avatarUrl":"https://yurucamp.jp/third/assets/img/character/character5face1.png","avatarPageUrl":"https://yurucamp.jp/third/character/","avatarSourceName":"Official character image"}],"storyBeats":["富士山、湖畔、围巾、营火和热饮，是凛这一页最安静也最有画面的元素。","青蓝主色让纸面像清晨的湖，10000 面额则像一张认真保存的旅行票。","实拍图如果带自然光，会更像从营地回家后才舍不得收起的纪念物。"],"production":[{"label":"原作","value":"Afro"},{"label":"动画制作","value":"C-Station / 8bit"},{"label":"系列构成","value":"田中仁"},{"label":"音乐","value":"立山秋航"},{"label":"志摩凛声优","value":"东山奈央"}],"officialSources":[{"label":"动画门户官网","url":"https://yurucamp.jp/"},{"label":"第一季角色页","url":"https://yurucamp.jp/first/character/"},{"label":"第三季角色页","url":"https://yurucamp.jp/third/character/"}],"assetKeywords":["rin","shima","visual","character","season","camp","fuji"],"maxOfficialImages":8,"visualNotes":[{"label":"围巾","title":"冬日空气的柔软边缘","text":"围巾让凛的冷静不显得疏远。票面可以用柔和边线承接它，让青蓝色里有一点温度。"},{"label":"摩托","title":"一个人出发的方向感","text":"摩托代表路线和独处。编号与细线可以像地图标注，让 MangaBill 有“抵达某地”的证据感。"},{"label":"湖面","title":"青蓝色要像清晨","text":"湖畔青蓝不需要很艳，它应该像冷空气和远山反光，安静地铺在背景里。"},{"label":"营灯","title":"小小的暖光更珍贵","text":"在冷色票面里留一处暖光，会让营地的治愈感显出来，也让实拍纸纹更像旅行回忆。"}],"artifactNotes":[{"label":"路线","title":"编号像地图坐标","text":"把面额和编号处理得像路线坐标，能让这张 MangaBill 更像一张露营通行券。"},{"label":"冷光","title":"青蓝保持安静","text":"青蓝主色越克制，越能保留凛独处时的节奏。"},{"label":"暖点","title":"营灯不要缺席","text":"一点暖黄就够了，它像杯面、热茶和帐篷里透出的灯。"}],"objectNotes":[{"label":"围巾","title":"冬天里最安静的安全感","text":"志摩凛的颜色不该太甜，应该像冷空气里的一口热气。围巾可以变成票面柔软的横向纹路，让她的孤独看起来不是疏离，而是舒服。","sourceLabel":"动画官网 Season 3 角色页","sourceUrl":"https://yurucamp.jp/third/character/rin.php"},{"label":"摩托与路线","title":"一个人出发，也会想着朋友","text":"官网写到她喜欢一个人的安静时间，也会在意朋友。票面路线线条可以从角落绕到中心，像她从独行慢慢学会靠近。","sourceLabel":"动画官网 Season 3 角色页","sourceUrl":"https://yurucamp.jp/third/character/rin.php"},{"label":"营灯与热饮","title":"小火光把夜色照得很近","text":"《摇曳露营》的回味常常来自热汤、营灯和山风。MangaBill 这一版适合用暖黄小面积点亮深绿，让粉丝想起露营椅旁边那一点灯。","sourceLabel":"动画官网 Cast / Staff","sourceUrl":"https://yurucamp.jp/first/sp/caststaff/"}],"memoryLine":{"mode":"情绪意译","line":"一个人也可以把夜晚过得很暖。","note":"凛的温柔很轻，不会扑上来。她只是把路线查好、把灯点上、把担心藏在消息里；这种轻轻的陪伴，正适合做成低饱和的票面光。","sourceLabel":"动画官网 Season 3 角色页","sourceUrl":"https://yurucamp.jp/third/character/rin.php"},"minOfficialLongEdge":580,"manualAssets":[{"url":"https://yurucamp.jp/third/assets/img/episodes/01/01_1.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"},{"url":"https://yurucamp.jp/third/assets/img/episodes/02/02_5.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"},{"url":"https://yurucamp.jp/third/assets/img/episodes/03/03_2.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"},{"url":"https://yurucamp.jp/third/assets/img/episodes/03/03_4.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"},{"url":"https://yurucamp.jp/third/assets/img/episodes/04/04_1.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"},{"url":"https://yurucamp.jp/third/assets/img/episodes/09/09_2.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"},{"url":"https://yurucamp.jp/third/assets/img/episodes/11/11_5.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"},{"url":"https://yurucamp.jp/third/assets/img/episodes/11/11_6.jpg","pageUrl":"https://yurucamp.jp/third/","sourceName":"Official visual","caption":"curated Rin visual"}],"manualOnly":true},{"slug":"frieren","workTitle":"葬送的芙莉莲","workSubtitle":"Frieren: Beyond Journey's End","sourceType":"动画","officialSite":"https://frieren-anime.jp/","tagline":"魔王倒下之后，旅途没有结束；时间开始以更安静的方式回声。","overview":["《葬送的芙莉莲》把故事放在冒险结束之后。官网介绍里，芙莉莲是千年以上的精灵魔法使，因欣梅尔的离世开始想要理解人类，于是旧旅程的回声和新旅伴的脚步交叠在一起。","芙丽莲这一页应该像旧书页和长途账本：蓝白、浅金、法杖、魔法书和很大的留白，一起讲时间慢慢沉下来的重量。"],"characterFocus":["芙丽莲有精灵的长寿，也有看似淡然的性格。她喜欢收集各种魔法，常常被细小的魔法吸引；这种“漫长时间里的小执念”让角色很耐看。","她的票面要以芙丽莲本人为中心：精灵耳、双马尾、法杖、行李箱和旧队伍的记忆。菲伦与休塔尔克只作为新旅途的回声出现，不抢走这张蓝白长卷的主角位置。"],"relatedCharacters":[{"name":"欣梅尔","role":"勇者队伍的中心人物，也是芙丽莲重新理解人类时间的起点。","avatarUrl":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara1_thumb-4.png","avatarPageUrl":"https://frieren-anime.jp/character/","avatarSourceName":"Official character image"},{"name":"海塔","role":"旧队伍的僧侣，与菲伦的过去相连，让旧旅程延伸到新旅程。","avatarUrl":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara1_thumb-5.png","avatarPageUrl":"https://frieren-anime.jp/character/","avatarSourceName":"Official character image"},{"name":"菲伦","role":"新旅伴与弟子，让芙丽莲的长旅有了更具体的日常。","avatarUrl":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara02_thumb.png","avatarPageUrl":"https://frieren-anime.jp/character/","avatarSourceName":"Official character image"},{"name":"休塔尔克","role":"同行的战士少年，为旅途带来更鲜活的人间温度。","avatarUrl":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara03_thumb.png","avatarPageUrl":"https://frieren-anime.jp/character/","avatarSourceName":"Official character image"}],"storyBeats":["欣梅尔留下的记忆，是芙丽莲重新看待人类时间的入口。","法杖、魔法书和行李让票面像一页被保存很久的旅途账本。","这版 MangaBill 不需要热闹，空白和细纹会替漫长岁月说话。"],"production":[{"label":"原作","value":"山田钟人 / 阿部司"},{"label":"动画制作","value":"Madhouse"},{"label":"监督","value":"斋藤圭一郎"},{"label":"系列构成","value":"铃木智寻"},{"label":"音乐","value":"Evan Call"},{"label":"芙丽莲声优","value":"种崎敦美"}],"officialSources":[{"label":"芙丽莲角色页","url":"https://frieren-anime.jp/character/chara_group1/1-1/"},{"label":"动画官网","url":"https://frieren-anime.jp/"},{"label":"Introduction","url":"https://frieren-anime.jp/intro/"},{"label":"Character","url":"https://frieren-anime.jp/character/"}],"assetKeywords":["frieren","フリーレン","chara01","chara1_full","t01","character"],"maxOfficialImages":5,"visualNotes":[{"label":"精灵耳","title":"长寿先从轮廓里出现","text":"芙丽莲的精灵耳和双马尾是最清楚的识别点。票面可以把轮廓放得安静一点，让“很久以前就已经在旅途上”的感觉先出现。"},{"label":"法杖","title":"魔法收集者的旧书页","text":"她对魔法的兴趣常常落在细小处。法杖、书页和古典花纹适合做成暗纹，近看才像翻到藏起来的注释。"},{"label":"回忆","title":"欣梅尔不是背景板","text":"旧队伍的记忆是芙丽莲理解人类的路标。票面可以用浅金线条处理成远处的光，而不是把回忆写得太满。"},{"label":"长旅","title":"蓝白像被时间洗过","text":"蓝白主色不追求冷酷，而像长旅之后被风洗淡的颜色。MangaBill 的留白越稳，芙丽莲越像芙丽莲。"}],"artifactNotes":[{"label":"长卷","title":"纸面像旅途账本","text":"蓝白底色、浅金花纹和编号组合起来，像一页被带过许多城镇的旧账本。"},{"label":"魔法","title":"细小咒文藏在暗纹里","text":"芙丽莲迷人的地方常在小魔法里；暗纹和细线比大面积特效更合适。"},{"label":"时间","title":"留白就是叙事","text":"这里的空白不是空，像长寿精灵还没说出口的迟到理解。"}],"minOfficialLongEdge":700,"manualAssets":[{"url":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara01_full1.png","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara1_full2.png","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2023/09/01_01.jpg","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2023/09/01_04.jpg","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated official visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2024/03/01_03-4.jpg","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated official visual"}],"objectNotes":[{"label":"法杖","title":"千年时间握成一根线","text":"芙莉莲的法杖不是炫耀力量，而是长旅里一直在手边的东西。票面可以让杖头线条和面额花纹互相交叠，像时间慢慢绕回来。","sourceLabel":"动画官网 芙莉莲角色页","sourceUrl":"https://frieren-anime.jp/character/chara_group1/1-1/"},{"label":"魔法书","title":"她收藏的不是魔法，是被人记住的方式","text":"官网写她对魔法有兴趣，也因欣梅尔的离去开始想了解人类。魔法书适合成为票面暗纹：翻页很轻，但每一页都在靠近某个人。","sourceLabel":"动画官网 芙莉莲角色页","sourceUrl":"https://frieren-anime.jp/character/chara_group1/1-1/"},{"label":"旅途餐桌","title":"长生者也会被一顿饭留住","text":"芙莉莲的旅途越长，饭桌、甜点、普通的小事越珍贵。MangaBill 里加入一点暖色，不是破坏冷白，而是把她迟来的理解藏进去。","sourceLabel":"动画官网","sourceUrl":"https://frieren-anime.jp/"}],"memoryLine":{"mode":"官网短句","line":"人間を知りたい。","note":"这句很短，却几乎能托住整趟旅程。MangaBill 这一版不需要把悲伤讲满，只要让白金色和浅绿慢慢呼吸，就会想起欣梅尔留下的那束光。","sourceLabel":"动画官网 芙莉莲角色页","sourceUrl":"https://frieren-anime.jp/character/chara_group1/1-1/"},"manualOnly":true},{"slug":"furina","workTitle":"原神","workSubtitle":"Genshin Impact: Fontaine","sourceType":"游戏","officialSite":"https://ys.mihoyo.com/main/m/character/fontaine","tagline":"她把审判庭变成舞台，也把纯蓝色变成一次盛大的登场。","overview":["芙宁娜来自《原神》的枫丹篇。枫丹的审判、歌剧院、水元素和公共观看，让她天然带着“在众目之下登场”的戏剧感。","这版 MangaBill 需要像剧场纪念票：纯蓝主光压住全场，白色和银色托起礼服、浪花、审判席与编号。"],"characterFocus":["官方角色页强调她深受民众喜爱，也把她与欧庇克莱歌剧院、审判和观众目光联系在一起。她像站在舞台中央的人，也像被整座枫丹反复注视的人。","票面要抓住她的“登场感”：礼帽、蓝白礼服、水滴、舞台弧线和纯蓝色反光。那维莱特、娜维娅等角色可以作为枫丹背景出现，但这束蓝光只照向芙宁娜。"],"relatedCharacters":[{"name":"那维莱特","role":"枫丹最高审判官，与枫丹审判体系密切相关。","avatarUrl":"https://act-webstatic.mihoyo.com/upload/contentweb/hk4e/9911ae2bf7e021b4431feac72bf1a6a8_6768181352554720731.png","avatarPageUrl":"https://ys.mihoyo.com/main/m/character/fontaine","avatarTrim":true,"avatarSourceName":"Official character image"},{"name":"娜维娅","role":"枫丹篇重要角色，代表民间组织与现实事件线。","avatarUrl":"https://fastcdn.mihoyo.com/content-v2/hk4e/155766/0f15be81ffcbff427c79dae83937929f_7863855640061116123.png","avatarPageUrl":"https://ys.mihoyo.com/main/m/character/fontaine","avatarTrim":true,"avatarSourceName":"Official character image"},{"name":"阿蕾奇诺","role":"愚人众执行官之一，是枫丹篇中强烈的外部压力来源。","avatarUrl":"https://fastcdn.mihoyo.com/content-v2/hk4e/123214/682a74b967b61b1a457f0f470cf73606_3283616759239336545.png","avatarPageUrl":"https://ys.mihoyo.com/main/m/character/fontaine","avatarTrim":true,"avatarSourceName":"Official character image"}],"storyBeats":["欧庇克莱歌剧院、审判席和观众席，是芙宁娜页面最核心的舞台结构。","纯蓝色负责主光，白色和银色负责礼服、浪花与纸币边框的仪式感。","官方立绘与 MangaBill 水纹放在一起时，要像一张剧场纪念票，也像一张被精心编号的收藏钞。"],"production":[{"label":"开发与发行","value":"HoYoverse / 米哈游"},{"label":"作品类型","value":"开放世界冒险游戏"},{"label":"地区主题","value":"枫丹"},{"label":"中文声优","value":"钱琛"},{"label":"日文声优","value":"水濑祈"}],"officialSources":[{"label":"原神枫丹角色页","url":"https://ys.mihoyo.com/main/m/character/fontaine"},{"label":"原神国际角色页","url":"https://genshin.hoyoverse.com/en/character/fontaine"}],"assetKeywords":["芙宁娜","Furina","钱琛","character__person","fontaine"],"maxOfficialImages":5,"visualNotes":[{"label":"礼帽","title":"轮廓先于登场","text":"芙宁娜的礼帽和蓝白正装让她一眼带着剧场感。票面可以把帽檐和肩线转成上方边框，像舞台幕布刚刚升起。"},{"label":"水纹","title":"纯蓝色不是背景，是主光","text":"**#1688E8 枫丹纯蓝** 应该像聚光灯。水纹和银白细线把蓝色变成流动的舞台，而不是普通渐变。"},{"label":"审判","title":"观众席让角色更有张力","text":"芙宁娜的魅力和“被观看”有关。审判席、观众席、歌剧院弧线都能变成票面秩序，让华丽不失控。"},{"label":"纪念票","title":"像一次盛大演出的入场券","text":"面额、编号和白银边框可以处理成剧场票根，MangaBill 因此既是收藏钞，也是枫丹舞台的一次入场。"}],"artifactNotes":[{"label":"主光","title":"纯蓝照亮全场","text":"**#1688E8** 是芙宁娜这页的主光，黑暗模式下尤其要像歌剧院里的蓝色反射。"},{"label":"银边","title":"仪式感靠细线撑住","text":"白银边线让水纹、礼服和审判主题收束起来，避免画面只剩华丽。"},{"label":"编号","title":"收藏钞也像剧场票根","text":"编号感越明确，越像一张被保存下来的枫丹纪念票。"}],"objectNotes":[{"label":"茶具","title":"谢幕后的一杯下午茶","text":"芙宁娜的茶具很适合做成票面素材：它像舞台之外的片刻休息，也像她终于能把笑容放下来。MangaBill 可以用**纯蓝与瓷白**做主色，再用杯缘金线收住精致感。","sourceLabel":"芙宁娜茶具周边资料","sourceUrl":"https://hoyo.global/product/genshin-official-furina-tea-cup/"},{"label":"歌剧院","title":"她一直站在观众的目光里","text":"原神官网写芙宁娜热衷欧庇克莱歌剧院的审判，也在意观众眼光。票面里的蓝色不该只是水元素，还要像舞台灯落在她肩上。","sourceLabel":"原神枫丹角色页","sourceUrl":"https://ys.mihoyo.com/main/m/character/fontaine"},{"label":"礼帽与水光","title":"明亮的外表，藏着很轻的疲惫","text":"芙宁娜的代表感在于“演出”与“脆弱”并存。把礼帽轮廓、水滴纹和票面编号叠在一起，会比单纯堆蓝色更像她。","sourceLabel":"角色演示《世界皆舞台》","sourceUrl":"https://ys.mihoyo.com/main/news/detail/29361"}],"memoryLine":{"mode":"官方歌词意象","line":"世界不过舞台。","note":"这句来自角色演示的舞台意象，放在票面上很锋利：粉丝会懂她的漂亮不是轻松得来的。蓝色越纯，越要留一处安静的白给她休息。","sourceLabel":"角色演示《世界皆舞台》","sourceUrl":"https://ys.mihoyo.com/main/news/detail/29361"},"manualAssets":[{"url":"https://act-webstatic.mihoyo.com/upload/contentweb/hk4e/e8d153da1a2dca7a07fd76397cd60612_7641410511196198159.png","pageUrl":"https://ys.mihoyo.com/main/m/character/fontaine","sourceName":"??????","caption":"???????"},{"url":"https://i.ytimg.com/vi/EN79SfbcvIE/maxresdefault.jpg","pageUrl":"https://www.youtube.com/watch?v=EN79SfbcvIE","sourceName":"??????","caption":"?????????"},{"url":"https://i.ytimg.com/vi/aau-c8l5z9c/maxresdefault.jpg","pageUrl":"https://www.youtube.com/watch?v=aau-c8l5z9c","sourceName":"??????","caption":"??????????"},{"url":"https://i.ytimg.com/vi/jHjUHKdoaqI/maxresdefault.jpg","pageUrl":"https://www.youtube.com/watch?v=jHjUHKdoaqI","sourceName":"??????","caption":"????????"},{"url":"https://i.ytimg.com/vi/bu2lCHmVV0w/maxresdefault.jpg","pageUrl":"https://www.youtube.com/watch?v=bu2lCHmVV0w","sourceName":"??????","caption":"?????????"}],"manualOnly":true},{"slug":"fern","workTitle":"葬送的芙莉莲","workSubtitle":"Frieren: Beyond Journey's End","sourceType":"动画","officialSite":"https://frieren-anime.jp/","tagline":"她把漫长旅途落到日常：赶路、修行、照顾同伴，也慢慢长成自己的样子。","overview":["菲伦同样来自《葬送的芙莉莲》，但她的气质不应和芙丽莲混在一起。官网角色页写到，她是芙丽莲的弟子，也是由海塔抚养长大的战灾孤儿；她以扎实的魔力操作和修行走到一线魔法使的位置。","因此菲伦这一页要更贴近日常与成长。暮紫、柔光、法杖、行李和细密纸纹，比宏大的长卷更适合她。"],"characterFocus":["菲伦常常承担队伍里现实而细致的一面：提醒、照顾、赶路、练习，也会在休塔尔克面前露出年轻女孩的表情。她的成熟不是冷淡，而是从经历里长出的克制。","票面必须以菲伦为主。芙丽莲是师父，海塔是她过去的温柔起点，休塔尔克是旅途中逐渐靠近的人；这些关系都围绕菲伦的成长展开。"],"relatedCharacters":[{"name":"芙丽莲","role":"菲伦的师父与同行者，把她带入新的旅途，却不替她成为主角。","avatarUrl":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara01_thumb.png","avatarPageUrl":"https://frieren-anime.jp/character/","avatarSourceName":"Official character image"},{"name":"海塔","role":"抚养菲伦的人，也是她温柔过去的重要来源。","avatarUrl":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara1_thumb-5.png","avatarPageUrl":"https://frieren-anime.jp/character/","avatarSourceName":"Official character image"},{"name":"休塔尔克","role":"同行的战士少年，让菲伦在沉稳之外露出更年轻、更日常的一面。","avatarUrl":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara03_thumb.png","avatarPageUrl":"https://frieren-anime.jp/character/","avatarSourceName":"Official character image"}],"storyBeats":["海塔抚养她的过去，让菲伦的沉稳有了来处。","法杖、披肩、行李和日常照顾，比宏大冒险更能说明她。","暮紫柔光让 MangaBill 像一张夹在旅行笔记里的纸，安静却被保存得很认真。"],"production":[{"label":"原作","value":"山田钟人 / 阿部司"},{"label":"动画制作","value":"Madhouse"},{"label":"监督","value":"斋藤圭一郎"},{"label":"音乐","value":"Evan Call"},{"label":"菲伦声优","value":"市之濑加那"}],"officialSources":[{"label":"菲伦角色页","url":"https://frieren-anime.jp/character/chara_group1/1-5/"},{"label":"动画官网","url":"https://frieren-anime.jp/"},{"label":"Introduction","url":"https://frieren-anime.jp/intro/"},{"label":"Character","url":"https://frieren-anime.jp/character/"}],"assetKeywords":["fern","フェルン","chara02","chara2_full","t02","character"],"maxOfficialImages":5,"visualNotes":[{"label":"暮紫","title":"先和芙丽莲的蓝白分开","text":"菲伦需要自己的颜色。暮紫和柔白让她从芙丽莲的长寿感里分离出来，更贴近年轻魔法使的沉稳。"},{"label":"法杖","title":"扎实修行的线条","text":"她的强大来自长期训练和精细控制。法杖可以成为票面中心竖线，让画面稳，也让成长有支点。"},{"label":"日常","title":"赶路、提醒、照顾同伴","text":"菲伦的魅力在细处。她让旅途不只是传说，也有早起、收拾行李和照看同伴的具体时间。"},{"label":"关系","title":"她不是旁边的人","text":"芙丽莲、海塔、休塔尔克都重要，但票面叙事要回到菲伦：她如何被照顾，又如何学会照顾别人。"}],"artifactNotes":[{"label":"暮紫","title":"柔光压低声音","text":"暮紫主色让菲伦页和芙丽莲页明显分开，也保留她安静的力量。"},{"label":"细纹","title":"纸面像旅行笔记","text":"细密纹理比大面积特效更适合她，像一张被认真夹好的路上收据。"},{"label":"成长","title":"编号记录每一步","text":"面额和编号可以像修行刻度，提醒她的强大不是突然出现的。"}],"minOfficialLongEdge":700,"manualAssets":[{"url":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara02_full1.png","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated Fern visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2023/08/chara2_full2.png","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated Fern visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2023/09/01_01-1.jpg","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated Fern visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2023/09/01_03-1.jpg","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated Fern visual"},{"url":"https://frieren-anime.jp/wp-content/uploads/2024/02/01_05-6.jpg","pageUrl":"https://frieren-anime.jp/story/","sourceName":"Official visual","caption":"curated Fern visual"}],"objectNotes":[{"label":"法杖","title":"把克制练成可靠","text":"官网写菲伦从小掌握卓越的魔力操作技术。她的法杖适合做成深紫色纵线，像她不多说话，却每一次都稳稳站在同伴身边。","sourceLabel":"动画官网 菲伦角色页","sourceUrl":"https://frieren-anime.jp/character/chara_group1/1-5/"},{"label":"披肩","title":"温柔不是软弱，是每天都记得照顾","text":"菲伦像芙莉莲一行人的日常秩序。票面可以把披肩的暮紫做成大面积主色，再让浅粉线条像她偶尔露出的少女心。","sourceLabel":"动画官网 菲伦角色页","sourceUrl":"https://frieren-anime.jp/character/chara_group1/1-5/"},{"label":"旅途餐点","title":"她把漫长旅程照顾成一天一天","text":"对菲伦来说，长旅不是传说，而是每天起床、赶路、吃饭、提醒芙莉莲。MangaBill 这一版可以多一点生活纹理，让她的稳重更有人味。","sourceLabel":"动画官网","sourceUrl":"https://frieren-anime.jp/"}],"memoryLine":{"mode":"情绪意译","line":"我会陪你走完今天，也陪你走向很远。","note":"菲伦的共鸣来自安静的陪伴。她不是只负责“成熟”，她也会害羞、会生气、会在旅途中慢慢长大；票面要让暮紫色显得柔软，而不是沉闷。","sourceLa
